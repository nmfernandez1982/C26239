<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }

              body {
                    font-family: Arial, sans-serif;
                    background: #F4F6F5;
                    padding: 30px 20px;
                    line-height: 1.5;
                }

                h1 { color: #1F6F66; margin-bottom: 20px; }
                h2 { color: #1F6F66; font-size: 20px; margin: 30px 0 8px; }
                p  { margin-bottom: 8px; }

                pre {
                        background: #23272E;
                        color: #E6E6E6;
                        padding: 10px 14px;
                        border-radius: 6px;
                        font-size: 14px;
                        margin: 8px 0;
                    }


                        .boton {
                            background: #2F8F83;
                            color: white;
                            border: none;
                            padding: 12px 22px;
                            border-radius: 6px;
                            font-size: 15px;
                            cursor: pointer;
                            transition: background 0.3s;                            
                        }

                        
                     .demo {
                            background: white;
                            border: 1px solid #DDE3E1;
                            border-radius: 8px;
                            padding: 20px;
                            display: flex;
                            gap: 12px;
                            align-items: center;
                        }

                        .boton:hover { background: #C94F4F;box-shadow: #929eb4 2px 2px; }

        </style>
    </head>
    <body>
        <h2>Pseudo Selectores</h2>

        <div class="demo">
            <button class="boton">Ingresar</button>
        </div>
    
    </body>
</html>
